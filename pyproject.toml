[project]
name = "liqfade"
version = "0.1.0"
description = "Autonomous Hyperliquid perps bot that fades liquidation cascades"
requires-python = ">=3.12"
dependencies = [
    # Core runtime: recorder, control plane, CLI, live loop.
    "hyperliquid-python-sdk>=0.19,<1",
    "websockets>=15,<16",
    "uvloop>=0.21,<1",
    "orjson>=3.10,<4",
    "polars>=1.20,<2",
    "duckdb>=1.2,<2",
    "pyarrow>=19,<22",
    "numpy>=2.1,<3",
    "pydantic>=2.10,<3",
    "structlog>=25.1,<26",
    "httpx>=0.28,<1",
    "aiosqlite>=0.21,<1",
    "pyyaml>=6.0,<7",
    # Phase 2 historical ingestion only. boto3 is the only client that speaks
    # requester-pays S3; lz4 reads the archive frames.
    "boto3>=1.35,<2",
    "lz4>=4.3,<5",
]

[project.optional-dependencies]
panel = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "bcrypt>=4.2,<6",
    "itsdangerous>=2.2,<3",
]
# `liqfade lab`, the terminal workbench. Optional because the trading process must never
# import a TUI, and because the VPS can run the recorder without it.
lab = [
    "textual>=8.2,<9",
]

[project.scripts]
liqfade = "liqfade.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "pre-commit>=4.1,<5",
    "types-pyyaml>=6.0,<7",
    "httpx>=0.28,<1",
]
research = [
    "jupyterlab>=4.3,<5",
    "pandas>=2.2,<3",
    "matplotlib>=3.10,<4",
    "scipy>=1.15,<2",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["liqfade"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["liqfade/panel/frontend", "liqfade/panel/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # asserts are how tests assert
    "S104",  # binding 0.0.0.0 is guarded by panel.allow_non_loopback, not by lint
]

[tool.ruff.lint.per-file-ignores]
# Tests may block in async bodies (ASYNC240): they drive the code under test rather
# than sharing an event loop with the trading loop. N803: the fake S3 client has to
# mirror boto3's PascalCase keyword arguments or it is not a stand-in for one.
"tests/**" = ["S", "N803", "N806", "ASYNC240"]
"scripts/probe/**" = ["S", "T201"]
# Research and benchmark scripts print, and seed a generator to build synthetic tape.
# Neither is a cryptographic use and both are the point of the script.
"scripts/backtest_speed_check.py" = ["S311", "T201"]

[tool.mypy]
python_version = "3.12"
# Without this plugin mypy cannot see that Field(...) supplies a default, and every
# optional model field looks like a required constructor argument.
plugins = ["pydantic.mypy"]
files = ["liqfade"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "liqfade.config.*",
    "liqfade.features.*",
    "liqfade.control.*",
    "liqfade.strategy.*",
    "liqfade.sizing.*",
    "liqfade.risk.*",
    "liqfade.execution.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers -m 'not integration and not lake'"
markers = [
  "integration: needs testnet keys and network; deselected by default",
  "lake: needs the real Parquet lake at LIQFADE_DATA_DIR; deselected by default",
]
filterwarnings = [
    # polars emits this on every join_asof that passes `by=`, sorted or not, so it carries
    # no signal at all. A hundred copies of it hide the warnings that do.
    "ignore:Sortedness of columns cannot be checked when 'by' groups provided:UserWarning",
]
