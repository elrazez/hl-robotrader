# Base configuration. Layered: default.yaml -> {env}.yaml -> overrides.yaml -> LIQFADE_ env vars.
# Every value here is a Phase 3 research starting point, not a tuned parameter.
# Units and rationale are on every key. See docs/STRATEGY_AND_RISK.md.

env: paper  # paper | testnet | mainnet. Env file and LIQFADE_ENV normally set this.

paths:
  data_dir: data  # root of the data lake, the KILL flag, state.json and the sqlite order store
  reports_dir: reports  # backtest and research reports

universe:
  # Dynamic selection by liquidity, plus a fixed core that is always subscribed.
  core_coins: [BTC, ETH, SOL, HYPE]  # always in the universe regardless of rank
  top_n_by_volume: 20  # count: top N HL perps by dayNtlVlm from metaAndAssetCtxs
  min_day_ntl_vlm_usd: 20000000.0  # USD: below this a coin is too thin to fade a cascade in
  min_open_interest_usd: 5000000.0  # USD: OI floor, cascades need positions to liquidate
  min_listing_days: 14  # days: new listings have no stable vol baseline (STRATEGY_AND_RISK 3)
  refresh_min: 60  # minutes between metaAndAssetCtxs universe refreshes (DATA_SOURCES)
  exclude: []  # HL coin symbols never traded regardless of rank

venues:
  hyperliquid:
    enabled: true
    api_url: https://api.hyperliquid.xyz
    ws_url: wss://api.hyperliquid.xyz/ws
    ws_ping_s: 20  # seconds: server closes idle connections after 60s
    liq_weight: 1.0  # weight in aggregated liquidation notional; HL-exact is complete
    complete: false  # the free public feed does not flag liquidations, only the S3 pull does
  binance:
    enabled: true
    ws_url: wss://fstream.binance.com/ws/!forceOrder@arr
    liq_weight: 1.0  # throttled to one event/symbol/second, so a lower bound. Revisit in Phase 3
    complete: false
  bybit:
    enabled: true
    ws_url: wss://stream.bybit.com/v5/public/linear
    subscribe_batch: 10  # symbols per subscribe frame
    liq_weight: 1.0  # complete since 2025-02-25, this is the reference feed
    complete: true
  okx:
    enabled: true
    ws_url: wss://ws.okx.com:8443/ws/v5/public
    liq_weight: 1.0  # at most one update per contract per second, a lower bound
    complete: false
  coinalyze:
    enabled: true
    base_url: https://api.coinalyze.net/v1/
    poll_s: 60  # seconds between OI and funding polls; free tier allows 40 calls/min

recorder:
  compaction_hour_utc: 3  # UTC hour for nightly compaction into one file per table per day
  # Rows buffered per output file, which is one (table, venue, date, hour), not per coin
  # per stream: a buffer full before the hour is out writes an extra file for that hour.
  # The memory ceiling is this times the number of files being filled at once, which is
  # roughly the number of tables times venues, and does not grow with the universe.
  ring_buffer_rows: 200000
  gap_alert_s: 5.0  # seconds of silence on a stream that counts as a gap (Phase 1 DoD)
  silence_alert_s: 60.0  # seconds of silence that raises a Telegram alert
  # Rows the parser refused plus messages it could not read, per stream per hour, above
  # which Telegram is told. A venue renaming a field takes a feed to zero rows while the
  # socket stays up, so this is the only thing that would say so. Set above the handful of
  # malformed frames a busy day produces and far below the flood a schema change causes.
  parse_error_alert_1h: 100
  reconnect_backoff_min_s: 0.5  # seconds: initial reconnect delay
  reconnect_backoff_max_s: 30.0  # seconds: capped reconnect delay
  reconnect_jitter_frac: 0.3  # fraction of the delay added as uniform jitter
  disk_alert_pct: 80.0  # percent used on the data volume that raises an alert

features:
  decision_cadence_ms: 250  # milliseconds between feature ticks, identical live and in backtest
  windows_s: [15, 60, 300]  # seconds: trailing windows for liquidation intensity and returns
  z_lookback_h: 24  # hours of history for the liquidation z-score distribution
  z_grid_s: 60  # seconds: grid the z-score distribution is sampled on
  z_robust: true  # use median and MAD rather than mean and stdev, cascades are fat tailed
  rv_windows_s: [60, 300]  # seconds: realized volatility windows from 1s mid changes
  # Seconds: open interest change windows. The rule layer reads three of them, and they are
  # three different questions: the cascade window says whether OI is falling right now, 300s
  # says whether the flush has happened, and the hour says whether there was a crowded
  # position to flush in the first place.
  oi_windows_s: [60, 300, 3600]
  cvd_slope_window_s: 15  # seconds over which the CVD slope is measured
  depth_bps: 10.0  # basis points from the touch used for the depth features
  vwap_anchor_s: 300  # seconds: pre-cascade VWAP anchor for the displacement feature
  episodes:
    # Research ground truth for a liquidation cascade, docs/../PREREGISTRATION.md. Used by
    # scripts/research/, never by the live loop, which has its own online detector.
    join_gap_s: 60  # seconds: a longer silence than this between liquidations ends the episode
    # The two absolute floors are fixed by the preregistration and are not tunable by
    # Phase 3. Together they are roughly 2x the net-stress round trip, below which the
    # trade cannot pay even at 100% reversion; they exist because a purely relative rule
    # emits the same episode rate no matter how quiet the tape is.
    min_notional_usd: 250000.0  # USD: total liquidated notional in the episode
    min_move_bps: 30.0  # bps: abs(anchor_px - extreme_px) / anchor_px
    p95_lookback_d: 30  # days of the coin's own prior episodes behind the relative threshold
    liq_z_min: 3.0  # z-score: qualifies an episode regardless of the p95 rule
    peak_window_s: 15  # seconds: trailing window behind peak_liq_15s
    participation: 0.25  # fraction of post-extreme traded notional assumed takeable
    participation_window_s: 60  # seconds after the extreme over which capacity is measured
  levels:
    # Supply and demand zones for Q7, built from candles_1m. Deliberately dumb: fractals and
    # rolling extremes only, so a level is one a trader could have drawn beforehand. A
    # fractal is not knowable until fractal_n bars after it forms, which the feature enforces.
    fractal_n: 12  # bars each side a swing high or low must strictly beat, so 25 bars in all
    range_d: 5  # days behind the rolling highest high and lowest low
    max_dist_bps: 200.0  # bps: a level further than this is reported absent, not far away
    zone_width_bps: 15.0  # bps: how close the cascade extreme must be to count as in the zone
  proxy:
    # HL-native forced flow proxy, since the free feed does not flag liquidations.
    vol_median_lookback_s: 3600  # seconds of trailing aggressive volume used as the denominator
    oi_delta_window_s: 60  # seconds: OI must be falling over this window for forced flow
    mark_mid_pct_threshold: 95.0  # percentile of trailing abs(mark-mid)/mid that must be exceeded

cascade:
  # Cascade start, per coin per side. All conditions must hold.
  # Which feed the trigger reads. One detector and one engine behind all three, so the
  # ceiling run and the eventual live run differ by this key rather than by a code path.
  #   exact:      the lake's `liquidations` table, source hl_s3. Backtest only. Settings
  #               refuses it on mainnet, because the live bot cannot see these events.
  #   proxy:      hl_forced_proxy_60s over proxy_min, from public Hyperliquid data. Q3
  #               measured precision 0.01 at the preregistered thresholds; a re-cut is
  #               outstanding. Shipped and off.
  #   crossvenue: aggregated liq_z_60s over the recorded Bybit and OKX feeds, weighted by
  #               venues.*.liq_weight. What Phase 5 runs if Q4 passes on 2026-11-04. On the
  #               historical year it has data on the twelve Tardis days only.
  # See docs/DECISIONS.md, 2026-09-06.
  trigger: exact  # exact | proxy | crossvenue
  # The two liquidation conditions. Each applies only when it is set; null skips it, and at
  # least one of them must be set or every row on the tape would pass.
  liq_z_min: 3.0  # z-score of aggregated liquidation notional over 60s. null: not applied
  # USD liquidated in window_s, per universe tier, looked up exactly as filters.max_spread_bps
  # is. The z-score says how unusual the flow is for this coin; this says whether it is large
  # enough in dollars to have moved price at all, which a z cannot say on a series that is
  # zero most of the time. null leaves the z-score as the only liquidation condition.
  liq_usd_min: null
  proxy_min: 4.0  # alternative trigger: hl_forced_proxy_60s multiple of median volume
  ret_over_rv_min: 2.0  # abs(ret_60s) / rv_5m, in the direction implied by the liquidated side
  imbalance_min: 0.6  # liq_imbalance_60s must favour the cascading side by at least this
  window_s: 60  # seconds: the window the three conditions above are evaluated over

exhaustion:
  # When the entry fires after a cascade starts.
  #   fixed_delay: enter fixed_delay_s after cascade start, ignoring the rule below.
  #   rule:        the spec's exhaustion rule, every condition for consecutive_ticks.
  # Q2 compared them over 2,722 episodes and the flat delay carried more PnL on every
  # month, so it is the default. The rule stays as code behind this switch rather than
  # being deleted, so turning it on in a backtest config prints what it costs.
  # reports/research/q2_exhaustion.md.
  mode: fixed_delay  # fixed_delay | rule
  fixed_delay_s: 120.0  # seconds after cascade start that mode=fixed_delay enters at (Q2)
  # All conditions must hold for consecutive_ticks in a row before an intent is emitted.
  consecutive_ticks: 3  # ticks at the 250ms cadence, so 750ms of confirmation
  liq_decay_frac: 0.25  # liq_15s must fall to this fraction of peak_liq_15s
  require_flow_flip: true  # cvd_slope_15s or book_imbalance must flip against the cascade
  mark_mid_pct_threshold: 80.0  # abs(mark-mid)/mid back under this trailing percentile
  no_new_extreme_s: 10.0  # seconds since the last new extreme mid
  min_age_s: 20.0  # seconds: younger cascades are still running
  max_age_s: 900.0  # seconds: older cascades are a different regime, drop them

intent:
  # k_target and k_stop are Phase 3 results, not starting points: Q8's winning grid cell
  # over 2,722 episodes, chosen because every neighbouring cell is also positive. It keeps
  # +80.6 of the +84.6 bps that holding to the horizon returns, at a 15% stop-out rate.
  # See reports/research/q8_path.md and docs/DECISIONS.md, 2026-09-05.
  k_target: 0.8  # fraction of (anchor_px - extreme_px) retraced; target = extreme + k*(anchor-extreme)
  k_stop: 1.0  # stop distance beyond the extreme in units of rv_5m * mid, vol scaled
  time_stop_s: 900  # seconds: flatten if neither target nor stop hit. Q8's grid used this and tested no other
  urgency_liq_z: 5.0  # liq_z_60s at or above this marks the intent high urgency
  allow_taker_entry_high_urgency: true  # only high urgency intents may fall back to a taker entry

filters:
  max_spread_bps:
    # Basis points. Flat 30 across tiers, not the old 3/6/12: Q6 measured the tiered caps
    # removing 51.9% of the sample to remove 36.3% of the loss tail, a concentration of
    # 0.70x against a 2x bar, so they were a signal filter that only shrank the book. 30 is
    # the core tier's own p99 effective spread (22.9 bps) rounded up: above it a quote has
    # stopped looking like a liquid perp's, and it is a sanity guard rather than a filter.
    # Q1 reports the slice it would have removed. docs/DECISIONS.md, 2026-09-05.
    core: 30.0
    major: 30.0
    minor: 30.0
  min_edge_multiple: 4.0  # expected edge must exceed this multiple of the round trip fee
  # Dropped by Q6's 2x rule: removes 26.7% of the sample to remove 33.3% of the loss tail,
  # a concentration of 1.25x. The market-wide bucket is where the pooled edge lives, so
  # skipping it also skips the upside. The exposure cap per cluster is what handles sweeps.
  skip_when_btc_cascading: false
  # Dropped by Q6: removes 0.6% of the sample and 0.0% of the loss tail. null means the
  # gate is not applied.
  funding_extreme_bps_8h: null
  min_notional_usd: 10.0  # USD: the Hyperliquid exchange minimum order value

strategy:
  # The confluence rule layer: extra entry conditions the owner can switch on without
  # touching engine code. Every ENABLED rule must pass after cascade and exhaustion fire
  # or the intent is dropped and the rule names itself as the reason; every rule's values
  # reach explain() either way, so a disabled rule still shows what it would have said.
  # With every rule disabled the engine is bit identical to the bare spec behaviour, which
  # is the configuration the golden test pins. A new rule is one class in
  # strategy/rules.py, one section here, one model field and one test.
  # Of the enabled rules with `required: false`, how many must pass. 0 evaluates them and
  # reports what they said without ever blocking an intent, which is how a rule earns its
  # place before it is allowed to cost a trade. A value higher than the number of enabled
  # optional rules is refused, because it would block everything.
  min_confluence: 0
  rules:
    zone_proximity:
      # Passes when the cascade extreme sits within zone_width_bps of a level that already
      # existed, from features/levels.py. OFF because Q7 found in-zone episodes revert
      # WORSE than out-of-zone: +36.1 bps against +146.3 at 15 bps over 1,523 in-zone
      # episodes. The code stays built and tested. reports/research/q7_zones.md.
      enabled: false
      required: true  # false makes it one confluence vote rather than a veto
      zone_width_bps: 15.0  # bps from the nearest level that counts as inside the zone
    min_cascade_notional:
      # Passes when the episode's liquidated notional exceeds the floor. Trivial on
      # purpose: it is the rule that proves the mechanism with something anyone can check.
      enabled: false
      required: true  # false makes it one confluence vote rather than a veto
      min_notional_usd: 250000.0  # USD of liquidated notional in the cascade so far
    oi_flush:
      # Passes when open interest fell over the rv window, so positions were actually
      # forced out rather than price merely moving, and optionally when open interest is
      # still up over the build window, which is the crowding there was to flush.
      enabled: false
      required: true  # false makes it one confluence vote rather than a veto
      drop_min_frac: 0.01  # fraction of open interest closed over the rv window
      build_min_frac: null  # fraction OI is up over the build window; null skips the half
    vwap_stretch:
      # Passes when mid is stretched past the VWAP the way the cascade pushed it: below it
      # for a long liquidation we are buying, above it for a short one.
      enabled: false
      required: true  # false makes it one confluence vote rather than a veto
      reference: day  # day: session VWAP from 00:00 UTC | anchor: features.vwap_anchor_s
      min_disp_bps: 30.0  # bps mid must sit past the VWAP
    level_reclaim:
      # The swing failure and the three tap: the cascade traded through a level that
      # already existed and price is back on the near side of it now. Reads the same
      # features/levels.py set zone_proximity does.
      enabled: false
      required: true  # false makes it one confluence vote rather than a veto
      sweep_min_bps: 5.0  # bps beyond the level the cascade extreme must have traded
      reclaim_min_bps: 0.0  # bps back past the level mid must be now

sizing:
  risk_frac: 0.005  # fraction of equity risked at the stop, 0.5%
  vol_participation: 0.02  # fraction of the coin's trailing 5 minute HL notional volume
  vol_window_s: 300  # seconds: the volume window the cap above is measured over
  depth_participation: 0.25  # fraction of resting depth within depth_bps on the side we hit
  coin_exposure_frac: 0.25  # max notional in one coin as a fraction of equity
  total_exposure_frac: 1.0  # max gross notional as a fraction of equity
  respect_venue_max_leverage: true  # also clamp to maxLeverage * equity from meta.universe

risk:
  max_daily_loss_frac: 0.03  # 3% of day start equity: halt entries until the next UTC day
  max_dd_frac: 0.10  # 10% below peak equity: halt and flatten, manual /resume required
  max_consecutive_losses: 6  # losing trades in a row before a cooldown
  cooldown_after_streak_min: 120  # minutes of no entries after a losing streak
  coin_cooldown_after_loss_min: 30  # minutes before re-entering a coin that lost
  coin_cooldown_after_exit_min: 5  # minutes before re-entering a coin after any exit
  max_concurrent_positions: 4  # count
  max_positions_per_direction: 3  # count
  # The per-cluster exposure cap. A cluster is every entry on the same side, across all
  # coins, inside cluster_window_s. A market-wide sweep liquidates dozens of coins in one
  # minute and the strategy would be in all of them at once, which is one bet however many
  # tickets it is written on. Phase 3 measured the difference: Q1's pooled +84.6 bps per
  # episode is +26.7 in the isolated-coin bucket and +34.0 with the top five clusters
  # removed, and the gap is cluster upside. Sizing on the pooled figure would size one bet
  # as if it were fifty. Neither the per-coin nor the total exposure cap catches this: forty
  # coins at 2% of equity each is inside both and is 80% of the account on one view.
  # docs/DECISIONS.md, 2026-09-05 and 2026-09-06.
  cluster_window_s: 300  # seconds: entries this close together on one side are one cluster
  max_cluster_exposure_frac: 0.25  # fraction of equity: gross notional entered per cluster
  stale_coin_s: 5.0  # seconds without an HL trade or bbo for a coin: no new entries in it
  stale_global_cancel_s: 15.0  # seconds of global feed silence: cancel all resting entries
  stale_global_flatten_s: 60.0  # seconds of global feed silence: flatten everything and halt
  max_reconnects_10min: 5  # reconnects on any critical feed before entries halt
  max_rejects_10min: 5  # exchange rejects before entries halt
  heartbeat_s: 1.0  # seconds between touches of data/heartbeat by the live loop
  watchdog_stale_s: 10.0  # seconds of heartbeat staleness before the watchdog cancels all
  kill_deadline_s: 5.0  # seconds within which /kill must have cancelled and flattened

execution:
  entry_tif: Alo  # post only at the touch; taker entries are the exception, not the rule
  entry_ttl_s: 3.0  # seconds a resting entry lives before it is repriced
  max_reprices: 3  # reprices per intent, capped because every action burns address rate limit
  taker_slippage_bps: 15.0  # bps bound on Ioc "market" orders; never the SDK 5% default
  reconcile_s: 60.0  # seconds between reconciliations against clearinghouseState and openOrders
  action_budget_per_hour: 600  # orders plus cancels plus modifies per hour, see HYPERLIQUID.md
  max_intents_per_coin_per_min: 2  # count, throttles the same cascade re-triggering
  transient_retries: 3  # retries with jitter on transport errors. Rejects are never retried
  use_isolated_margin: false  # cross margin by default, see docs/DECISIONS.md
  order_db: orders.sqlite  # filename under data_dir

backtest:
  # Milliseconds between rows of the precomputed feature grid. Separate from
  # features.decision_cadence_ms (250) on purpose: the spec's speed rule is to vectorize
  # features on a 1s grid and keep fills event driven, so at the default three of every
  # four decision ticks reread the row they saw before. That costs nothing under
  # exhaustion.mode fixed_delay, which only reads the clock. Set 250 to match live exactly
  # and expect four times the wall time and four times the memory.
  feature_grid_ms: 1000
  latency_ms: 1000  # milliseconds from intent to an order visible to the market (docs/DECISIONS)
  taker_fee_frac: 0.00045  # 0.045% of notional per side, base tier 2026-08
  maker_fee_frac: 0.00015  # 0.015% of notional per side, base tier 2026-08
  apply_funding: true  # accrue funding hourly while a position is open
  maker_queue_pessimism: 1.0  # multiplier on the assumed queue ahead at the resting price
  maker_requires_trade_through: true  # an Alo fills only on trade through or queue exhaustion
  slip_stale_bps: 5.0  # bps added when the L2 snapshot used for a taker fill is over 1s old
  stale_book_s: 1.0  # seconds after which an L2 snapshot counts as stale
  # The replay window around each cascade candidate. Outside it the portfolio is flat by
  # construction, so the tape there is read at all only to prove nothing was missed, which
  # it cannot be. Warmup is what the book, the tape and risk.stale_coin_s need to be current
  # by the time the detector could act; the margin is slack past the last thing a cascade
  # can cause (exhaustion.max_age_s + intent.time_stop_s), covering the order latency and
  # the tick the exit lands on. Both are seconds. See docs/DECISIONS.md, 2026-09-06.
  window_warmup_s: 300.0
  window_margin_s: 60.0
  holdout_frac: 0.25  # fraction of the chronological tail held out of any fitting
  walk_forward_refit_days: 30  # days between refits in the walk forward split
  bootstrap_samples: 1000  # trade level bootstrap draws for confidence intervals

control:
  socket_path: control.sock  # under data_dir, created with mode 0600
  state_file: state.json  # under data_dir, atomically rewritten every state_interval_s
  state_interval_s: 1.0  # seconds between state snapshots
  connect_timeout_s: 2.0  # seconds a client waits for the socket
  request_timeout_s: 5.0  # seconds a client waits for a response

panel:
  host: 127.0.0.1  # loopback only; reached over Tailscale or an SSH tunnel
  port: 8787
  allow_non_loopback: false  # must be set true explicitly to bind anything but loopback
  session_ttl_s: 43200  # seconds a login cookie stays valid, 12 hours
  login_max_attempts: 5  # failed logins per window before the client is locked out
  login_window_s: 300  # seconds the failed login window covers
  state_stale_s: 5.0  # seconds after which /api/state returns 503 rather than stale numbers

telegram:
  enabled: true
  alert_on_intent: true  # every intent is posted with its explain() values
  parse_mode: HTML
  send_timeout_s: 10.0  # seconds before an alert send is abandoned; alerts never block trading

sync:
  host: ""  # ssh target for `liqfade sync`, e.g. liqfade@vps. Usually from LIQFADE_SYNC_HOST
  remote_root: /srv/liqfade  # remote path holding data/ and reports/
  paths:  # relative to remote_root, pulled into the local project root
    - data/parquet/
    - data/orders.sqlite
    - data/state.json
    - reports/
  rsync_flags: [-az, --info=progress2, --partial]

logging:
  level: INFO  # DEBUG | INFO | WARNING | ERROR
  proc: unknown  # overwritten per process by runtime.setup_logging
